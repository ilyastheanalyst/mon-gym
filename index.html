<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1014">
<title>Mon Gym</title>
<meta name="apple-mobile-web-app-title" content="Mon Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0e1014;--card:#171a21;--card2:#1f232c;--line:#2a2f3a;--txt:#eef1f5;--mut:#8b93a3;
  --acc:#c8f53c;--acc-ink:#121500;--ok:#3ddc84;--warn:#ffb347;--bad:#ff5d5d;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-top:var(--safe-t)}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(150px + var(--safe-b))}
h1{font-size:24px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:0}
p{margin:6px 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
textarea{min-height:70px;resize:vertical}
.hero{padding:6px 2px 10px}
.kicker{color:var(--acc);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mut)}
.chip.today{color:var(--txt);border-color:#4a5263}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.rest{text-align:center;padding:34px 16px}
.big{font-size:44px}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.tgt{font-size:13px;color:var(--mut);white-space:nowrap;background:var(--card2);padding:3px 8px;border-radius:8px}
.hint{font-size:13px;color:var(--mut);margin:2px 0 8px}
.last{font-size:13px;color:#b8c0cf;margin:0 0 8px}
.up{display:inline-block;font-size:12px;font-weight:700;color:var(--acc-ink);background:var(--acc);padding:2px 7px;border-radius:6px;margin-left:4px}
.set{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.sn{width:22px;color:var(--mut);font-weight:700;font-size:14px;text-align:center}
.f{position:relative;flex:1;display:block}
.f input{padding-right:42px;text-align:right;font-weight:600}
.f span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);pointer-events:none}
.ck{width:46px;height:44px;flex:0 0 46px;border-radius:12px;border:2px solid var(--line);font-size:20px;font-weight:800;color:var(--acc-ink)}
.set.done .ck{background:var(--ok);border-color:var(--ok)}
.set.done input{border-color:#2d6b48;background:#17271f}
.row-actions{display:flex;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:800}
.btn.block{display:flex;width:100%;padding:15px;font-size:17px}
.btn.danger,.danger{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.btn.ghost{background:none}
.muted{color:var(--mut)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fd400,var(--acc));border-radius:99px}
.lbl{font-size:13px;color:var(--mut);display:block;margin:0 0 4px}
.field{margin-bottom:10px}
.banner{background:#2b2412;border:1px solid #5a4716;color:#ffd98a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner .row-actions{margin-top:8px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:16px 8px}
details.sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sess summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details.sess summary::-webkit-details-marker{display:none}
details.sess .body{padding:0 14px 12px;font-size:14px}
.pill{font-size:12px;color:var(--mut);background:var(--card2);padding:3px 8px;border-radius:8px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.plan-day{padding:10px 0;border-top:1px solid var(--line)}
.plan-day:first-child{border-top:0}
.plan-day ul{margin:4px 0 0;padding-left:18px;color:#c9d0dc;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
svg text{fill:var(--mut);font-size:10px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safe-b));z-index:20}
nav#tabs .in{display:flex;max-width:560px;width:100%}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mut)}
nav#tabs button .ic{font-size:21px;line-height:1}
nav#tabs button.on{color:var(--acc)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + var(--safe-b));width:calc(100% - 24px);max-width:536px;background:#20252f;border:1px solid #39404e;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:19;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#timer[hidden]{display:none}
#timer .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
#timer .l{flex:1;font-size:13px;color:var(--mut)}
#timer.fin{background:var(--acc);border-color:var(--acc)}
#timer.fin .t,#timer.fin .l{color:var(--acc-ink)}
#toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-250%);background:var(--acc);color:var(--acc-ink);font-weight:700;padding:10px 16px;border-radius:12px;z-index:30;transition:transform .25s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad);color:#fff}
.loading{text-align:center;padding:80px 20px;color:var(--mut)}
.store-note{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
</style>
</head>
<body>
<main id="view"><div class="loading"><div class="big">🏋️</div><p>Chargement…</p><p id="slow" class="small" hidden>La connexion est lente, on attend encore un peu…</p></div></main>
<div id="timer" hidden><div class="t" id="tt">1:30</div><div class="l" id="tl">Repos</div><button class="btn sm" data-a="timer-add">+15 s</button><button class="btn sm" data-a="timer-stop">✕</button></div>
<nav id="tabs"><div class="in">
  <button data-a="tab" data-t="today" class="on"><span class="ic">🏋️</span>Séance</button>
  <button data-a="tab" data-t="history"><span class="ic">📈</span>Historique</button>
  <button data-a="tab" data-t="weight"><span class="ic">⚖️</span>Poids</button>
  <button data-a="tab" data-t="plan"><span class="ic">📋</span>Programme</button>
</div></nav>
<div id="toast"></div>
<script>
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmtDate=s=>parseYmd(s).toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'});
const fmtShort=s=>parseYmd(s).toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const r1=n=>Math.round(n*10)/10;
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className=err?'err show':'show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className=err?'err':'',2200)}

/* ---------- programme ---------- */
const DAYS=[{k:'lun',l:'Lun',L:'Lundi'},{k:'mar',l:'Mar',L:'Mardi'},{k:'mer',l:'Mer',L:'Mercredi'},{k:'jeu',l:'Jeu',L:'Jeudi'},{k:'ven',l:'Ven',L:'Vendredi'},{k:'sam',l:'Sam',L:'Samedi'},{k:'dim',l:'Dim',L:'Dimanche'}];
const dayLabel=k=>(DAYS.find(d=>d.k===k)||{}).L||k;
const todayKey=()=>DAYS[(new Date().getDay()+6)%7].k;
const E=(n,s,r,rMax,type,hint)=>({n,s,r,rMax:rMax||r,type:type||'w',hint:hint||''});
const C=(n,min,hint)=>({n,min,hint:hint||''});
const PHASES=[
  {wk:'1–4',after:15,fri:'30–45 min',steps:'7 000'},
  {wk:'5–8',after:20,fri:'45 min',steps:'8 000–9 000'},
  {wk:'9–12',after:25,fri:'45 min',steps:'10 000'}];
const REST={t:'Repos',rest:true};
const PROGRAMS={
  machines:{name:'Machines seulement',short:'Machines',days:{
    lun:{t:'Haut du corps',ex:[
      E('Chest Press (machine)',2,12,12,'w','Pectoraux, triceps · essai 20–40 lb'),
      E('Lat Pulldown',2,12,12,'w','Dos, biceps · essai 40–60 lb'),
      E('Shoulder Press (machine)',2,10,10,'w','Épaules · essai 15–30 lb'),
      E('Seated Row',2,12,12,'w','Dos · essai 30–50 lb')],
      cardio:[C('Marche inclinée',15)]},
    mar:{t:'Cardio',ex:[],cardio:[C('Marche sur tapis',30,'Vitesse confortable, inclinaison 3–5 %'),C('Vélo stationnaire',10)]},
    mer:{t:'Jambes',ex:[
      E('Leg Press',2,12,12,'w','Charge légère selon la machine'),
      E('Leg Curl',2,12,12,'w','Essai 20–40 lb'),
      E('Leg Extension',2,12,12,'w','Essai 20–40 lb'),
      E('Calf Raise (machine)',2,15,15,'w','Charge légère selon la machine')],
      cardio:[C('Vélo léger',10)]},
    jeu:{t:'Cardio',ex:[],cardio:[C('Marche rapide sur tapis',30),C('Vélo intensité modérée',10)]},
    ven:{t:'Corps complet',ex:[
      E('Chest Press (machine)',2,12),E('Lat Pulldown',2,12),E('Leg Press',2,12),E('Seated Row',2,12),E('Leg Curl',2,12)],
      cardio:[C('Marche',15,'10 à 15 minutes')]},
    sam:{...REST,note:'Repos ou marche légère.'},dim:{...REST,note:'Repos et récupération.'}}},
  complet:{name:'Programme complet',short:'Complet',days:{
    lun:{t:'Push — pecs, épaules, triceps',ex:[
      E('Bench Press',3,8,10),E('Incline Dumbbell Press',3,10),E('Shoulder Press',3,10),
      E('Élévations latérales',3,12,15),E('Triceps à la poulie',3,12)],
      cardio:[C('Marche inclinée','P')]},
    mar:{t:'Pull — dos, biceps',ex:[
      E('Lat Pulldown',3,10),E('Seated Row',3,10,10,'w','Câble'),E('Dumbbell Row',3,10,10,'w','10 par côté'),
      E('Biceps Curls',3,12),E('Hammer Curls',2,12)],
      cardio:[C('Vélo ou tapis','P','15–20 min selon la phase')]},
    mer:{t:'Jambes et abdos',ex:[
      E('Leg Press',3,12),E('Romanian Deadlift',3,10),E('Leg Curl',3,12),E('Calf Raises',3,15),
      E('Planche',3,30,45,'t','30 à 45 secondes'),E('Crunches',3,15,15,'bw')],
      cardio:[C('Marche tranquille',10)]},
    jeu:{t:'Haut du corps complet',ex:[
      E('Incline Bench Press',3,10),E('Assisted Pull-ups',3,8,8,'w','Inscris le poids d\'assistance'),E('Chest-Supported Row',3,10),
      E('Shoulder Press',2,10),E('Face Pulls',3,15),E('Biceps Curls',2,12),E('Triceps à la poulie',2,12)],
      cardio:[C('Marche inclinée','P')]},
    ven:{t:'Cardio et abdos',ex:[E('Reverse Crunches',3,15,15,'bw'),E('Planche',3,30,30,'t')],
      cardio:[C('Marche inclinée',30,'Inclinaison 5–10 %, tu dois pouvoir parler'),C('Vélo',15,'Intensité modérée et régulière')]},
    sam:{...REST,note:'Repos ou marche légère.'},dim:{...REST,note:'Repos et récupération.'}}}
};
const WEEKLY_TARGET=5;

/* ---------- storage (cloud via db, fallback localStorage) ---------- */
const Store={mode:'local',db:null,uid:null,q:{},
  async init(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}},
  ref(p){return this.db.doc('data/users/'+this.uid+'/'+p)},
  col(){return this.ref('profile').collection('sessions')},
  run(key,fn){const p=(this.q[key]||Promise.resolve()).then(()=>fn());this.q[key]=p.catch(()=>{});return p},
  ls(k,v){try{if(v===undefined){const s=localStorage.getItem('gym_'+k);return s?JSON.parse(s):null}
    if(v===null)localStorage.removeItem('gym_'+k);else localStorage.setItem('gym_'+k,JSON.stringify(v))}catch(e){return null}},
  async getDoc(k){if(this.mode==='cloud'){const s=await this.ref(k).get();return s.exists?clone(s.data()):null}return this.ls(k)},
  setDoc(k,v){return this.run(k,async()=>{if(this.mode==='cloud')await this.ref(k).set(clone(v));else this.ls(k,v)})},
  delDoc(k){return this.run(k,async()=>{if(this.mode==='cloud')await this.ref(k).delete();else this.ls(k,null)})},
  async listSessions(){
    if(this.mode==='cloud'){const s=await this.col().orderBy('finishedAt','desc').limit(1000).get();return s.docs.map(d=>({...clone(d.data()),id:d.id}))}
    return this.ls('sessions')||[]},
  addSession(s){return this.run('s_'+s.id,async()=>{if(this.mode==='cloud')await this.col().doc(s.id).set(clone(s));else this.ls('sessions',[s,...(this.ls('sessions')||[])])})},
  delSession(id){return this.run('s_'+id,async()=>{if(this.mode==='cloud')await this.col().doc(id).delete();else this.ls('sessions',(this.ls('sessions')||[]).filter(x=>x.id!==id))})}
};
const saveErr=e=>{console.error(e);toast(e&&e.code==='quota_exceeded'?'Stockage plein — supprime de vieilles séances':'Erreur de sauvegarde, réessaie',true)};

/* ---------- state ---------- */
const S={profile:null,sessions:[],draft:null,preview:null,tab:'today',viewDay:null,pendingDay:null,histEx:null};
const defaultProfile=()=>({startWeight:182,targetWeight:162,startDate:ymd(mondayOf(new Date())),program:'machines',weighIns:[]});
function weekNum(){const d=Math.floor((parseYmd(ymd(new Date()))-parseYmd(S.profile.startDate))/864e5);return Math.max(1,Math.floor(d/7)+1)}
const phaseIdx=w=>w<=4?0:w<=8?1:2;
function saveProfile(){return Store.setDoc('profile',S.profile).catch(saveErr)}
let draftT;function saveDraftSoon(){clearTimeout(draftT);draftT=setTimeout(()=>{if(S.draft)Store.setDoc('draft',S.draft).catch(saveErr)},500)}

function lastFor(name){
  for(const s of S.sessions){const it=(s.items||[]).find(x=>x.kind==='ex'&&x.n===name&&x.sets&&x.sets.length);
    if(it)return{date:s.date,sets:it.sets,allDone:it.sets.length>=(it.planned||it.sets.length)}}
  return null}
function shouldIncrease(it,last){return it.type==='w'&&last&&last.allDone&&last.sets.every(s=>(num(s.reps)||0)>=it.rMax)}
function fmtSet(s,type){const r=num(s.reps)??'?';if(type==='t')return r+' s';if(type==='bw')return r+' reps';return (num(s.lb)??0)+' lb × '+r}

function buildDraft(day){
  const tpl=PROGRAMS[S.profile.program].days[day];const wk=weekNum();const ph=PHASES[phaseIdx(wk)];
  const items=[];
  (tpl.ex||[]).forEach(e=>{const last=lastFor(e.n);const sets=[];
    for(let j=0;j<e.s;j++){const ls=last?(last.sets[j]||last.sets[last.sets.length-1]):null;sets.push({lb:ls&&ls.lb!=null?ls.lb:'',reps:'',done:false})}
    items.push({kind:'ex',n:e.n,type:e.type,s:e.s,r:e.r,rMax:e.rMax,hint:e.hint,sets})});
  (tpl.cardio||[]).forEach(c=>items.push({kind:'cardio',n:c.n,hint:c.hint,min:c.min==='P'?ph.after:c.min,done:false}));
  return{date:ymd(new Date()),dayKey:day,program:S.profile.program,title:tpl.t,week:wk,items,notes:''}}
function working(){return S.draft||S.preview}
function touch(){if(!S.draft&&S.preview){S.draft=S.preview;S.preview=null}saveDraftSoon()}

/* ---------- timer ---------- */
const T={end:0,h:null};
function startTimer(sec){T.end=Date.now()+sec*1000;$('#timer').hidden=false;$('#timer').classList.remove('fin');clearInterval(T.h);T.h=setInterval(tick,250);tick()}
function tick(){const left=Math.max(0,Math.round((T.end-Date.now())/1000));$('#tt').textContent=Math.floor(left/60)+':'+z(left%60);
  if(left<=0){$('#timer').classList.add('fin');$('#tl').textContent='Repos terminé — prochaine série 💪';clearInterval(T.h);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  else $('#tl').textContent='Repos entre les séries'}
function stopTimer(){clearInterval(T.h);$('#timer').hidden=true}

/* ---------- chart ---------- */
function chart(pts,{target=null,unit='lb'}={}){
  if(pts.length<2)return'<div class="empty">Ajoute au moins 2 entrées pour voir la courbe.</div>';
  const W=340,H=170,P={l:34,r:10,t:10,b:22};
  const ys=pts.map(p=>p.y).concat(target!=null?[target]:[]);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1-y0<4){y0-=2;y1+=2}const pad=(y1-y0)*.12;y0-=pad;y1+=pad;
  const x0=pts[0].x,x1=pts[pts.length-1].x;
  const X=x=>P.l+(x1===x0?.5:(x-x0)/(x1-x0))*(W-P.l-P.r),Y=y=>P.t+(y1-y)/(y1-y0)*(H-P.t-P.b);
  let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2f3a"/><text x="${P.l-5}" y="${Y(v)+3}" text-anchor="end">${Math.round(v)}</text>`}
  const tl=target!=null?`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(target)}" y2="${Y(target)}" stroke="#c8f53c" stroke-dasharray="4 4" opacity=".7"/><text x="${W-P.r}" y="${Y(target)-4}" text-anchor="end" style="fill:#c8f53c">objectif ${target}</text>`:'';
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.2" fill="#c8f53c"/>`).join('');
  const lab=s=>new Date(s).toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graphique (${unit})">${g}${tl}<path d="${d}" fill="none" stroke="#c8f53c" stroke-width="2.5" stroke-linejoin="round"/>${dots}
  <text x="${P.l}" y="${H-5}">${lab(x0)}</text><text x="${W-P.r}" y="${H-5}" text-anchor="end">${lab(x1)}</text></svg>`}

/* ---------- views ---------- */
function viewToday(){
  const p=S.profile,wk=weekNum(),ph=PHASES[phaseIdx(wk)];
  const day=S.draft?S.draft.dayKey:(S.viewDay||todayKey());
  const prog=PROGRAMS[S.draft?S.draft.program:p.program];const tpl=prog.days[day];
  let h=`<section class="hero"><div class="kicker">Semaine ${wk}${wk>12?' · au-delà du plan':' / 12'} · ${prog.short}</div>
  <h1>${dayLabel(day)} — ${esc(tpl.t)}</h1><div class="sub">👣 Objectif ${ph.steps} pas aujourd'hui</div></section>
  <div class="chips">${DAYS.map(d=>`<button class="chip ${d.k===day?'on':''} ${d.k===todayKey()?'today':''}" data-a="day" data-k="${d.k}">${d.l}</button>`).join('')}</div>`;
  if(S.pendingDay)h+=`<div class="banner">Tu as une séance de <b>${dayLabel(S.draft.dayKey)}</b> en cours. L'abandonner pour passer à ${dayLabel(S.pendingDay)} ?
    <div class="row-actions"><button class="btn sm danger" data-a="day-discard">Abandonner</button><button class="btn sm" data-a="day-cancel">Continuer ma séance</button></div></div>`;
  else if(S.draft)h+=`<div class="banner">Séance en cours — tes entrées sont sauvegardées automatiquement.</div>`;
  if(tpl.rest)return h+`<div class="card rest"><div class="big">😌</div><h2>Jour de repos</h2><p class="muted">${esc(tpl.note)}</p><p class="small muted">Vise quand même ${ph.steps} pas.</p></div>`;
  if(!S.draft&&(!S.preview||S.preview.dayKey!==day||S.preview.program!==p.program))S.preview=buildDraft(day);
  const w=working();
  w.items.forEach((it,i)=>{h+=it.kind==='ex'?exCard(it,i):cardioCard(it,i)});
  h+=`<div class="card"><label class="lbl" for="notes">Notes (énergie, douleurs, réglages des machines…)</label><textarea id="notes" data-a="notes">${esc(w.notes)}</textarea></div>
  <div class="row-actions" style="margin-bottom:10px"><button class="btn sm" data-a="timer-start" data-s="60">⏱ 60 s</button><button class="btn sm" data-a="timer-start" data-s="90">⏱ 90 s</button><button class="btn sm" data-a="timer-start" data-s="120">⏱ 2 min</button></div>
  <button class="btn pri block" data-a="finish">✅ Terminer la séance</button>
  ${S.draft?'<div style="text-align:center;margin-top:10px"><button class="btn ghost sm muted" data-a="discard">Abandonner cette séance</button></div>':''}`;
  return h}
function exCard(it,i){
  const last=lastFor(it.n),up=shouldIncrease(it,last);
  const unit=it.type==='t'?'sec':'reps';
  const tgt=`${it.s} × ${it.r}${it.rMax>it.r?'–'+it.rMax:''}${it.type==='t'?' s':''}`;
  let h=`<div class="card"><div class="ct"><h3>${esc(it.n)}</h3><span class="tgt">${tgt}</span></div>`;
  if(it.hint)h+=`<div class="hint">${esc(it.hint)}</div>`;
  if(last)h+=`<div class="last">Dernière fois (${fmtShort(last.date)}) : ${last.sets.map(s=>fmtSet(s,it.type)).join(' · ')}${up?'<span class="up">↑ Monte la charge</span>':''}</div>`;
  it.sets.forEach((s,j)=>{h+=`<div class="set ${s.done?'done':''}" id="set-${i}-${j}"><span class="sn">${j+1}</span>
    ${it.type==='w'?`<label class="f"><input type="number" inputmode="decimal" step="any" data-a="lb" data-i="${i}" data-j="${j}" value="${esc(s.lb)}" placeholder="0"><span>lb</span></label>`:''}
    <label class="f"><input type="number" inputmode="numeric" data-a="reps" data-i="${i}" data-j="${j}" value="${esc(s.reps)}" placeholder="${it.rMax}"><span>${unit}</span></label>
    <button class="ck" data-a="done" data-i="${i}" data-j="${j}" aria-label="Série ${j+1} faite">${s.done?'✓':''}</button></div>`});
  h+=`<div class="row-actions"><button class="btn sm" data-a="addset" data-i="${i}">+ Série</button>${it.sets.length>1?`<button class="btn sm" data-a="rmset" data-i="${i}">− Série</button>`:''}</div></div>`;
  return h}
function cardioCard(it,i){
  return`<div class="card"><div class="ct"><h3>🏃 ${esc(it.n)}</h3><span class="tgt">${esc(it.min)} min</span></div>${it.hint?`<div class="hint">${esc(it.hint)}</div>`:''}
  <div class="set ${it.done?'done':''}" id="c-${i}"><label class="f"><input type="number" inputmode="numeric" data-a="min" data-i="${i}" value="${esc(it.min)}"><span>min</span></label>
  <button class="ck" data-a="cdone" data-i="${i}" aria-label="Cardio fait">${it.done?'✓':''}</button></div></div>`}

function sessStats(s){let vol=0,sets=0,card=0;(s.items||[]).forEach(it=>{if(it.kind==='ex'){it.sets.forEach(x=>{sets++;if(it.type==='w')vol+=(num(x.lb)||0)*(num(x.reps)||0)})}else card+=num(it.min)||0});return{vol,sets,card}}
function viewHistory(){
  const mon=ymd(mondayOf(new Date()));const thisWeek=S.sessions.filter(s=>s.date>=mon);
  const cw=thisWeek.reduce((a,s)=>a+sessStats(s).card,0);
  let h=`<section class="hero"><div class="kicker">Historique</div><h1>Ta progression</h1></section>
  <div class="card"><div class="grid3"><div class="stat"><b>${thisWeek.length}/${WEEKLY_TARGET}</b><span>Séances cette semaine</span></div>
  <div class="stat"><b>${cw}</b><span>Min cardio cette semaine</span></div><div class="stat"><b>${S.sessions.length}</b><span>Séances au total</span></div></div></div>`;
  const names=[...new Set(S.sessions.flatMap(s=>(s.items||[]).filter(i=>i.kind==='ex'&&i.type==='w').map(i=>i.n)))].sort();
  if(names.length){if(!names.includes(S.histEx))S.histEx=names[0];
    const pts=[];let pr=null;
    [...S.sessions].reverse().forEach(s=>{const it=(s.items||[]).find(i=>i.kind==='ex'&&i.n===S.histEx);if(!it)return;
      let best=null;it.sets.forEach(x=>{const lb=num(x.lb);if(lb!=null&&(best==null||lb>best.lb))best={lb,reps:num(x.reps)}});
      if(best){pts.push({x:parseYmd(s.date).getTime(),y:best.lb});if(!pr||best.lb>pr.lb||(best.lb===pr.lb&&(best.reps||0)>(pr.reps||0)))pr={...best,date:s.date}}});
    h+=`<div class="card"><h2>Charge par exercice</h2><select data-a="histex">${names.map(n=>`<option ${n===S.histEx?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <div style="margin-top:10px">${chart(pts)}</div>${pr?`<p class="small muted">🏆 Record : <b style="color:var(--txt)">${pr.lb} lb × ${pr.reps??'?'}</b> (${fmtShort(pr.date)})</p>`:''}</div>`}
  if(!S.sessions.length)return h+'<div class="card empty">Aucune séance encore. Termine ta première séance et elle apparaîtra ici 💪</div>';
  h+='<h2 style="margin:18px 2px 10px">Séances</h2>';
  S.sessions.forEach(s=>{const st=sessStats(s);
    h+=`<details class="sess"><summary><div><b>${esc(s.title)}</b><div class="small muted">${fmtDate(s.date)} · sem. ${s.week||'?'}</div></div>
    <span class="pill">${st.sets} séries${st.card?' · '+st.card+' min':''}</span></summary><div class="body">
    ${(s.items||[]).map(it=>it.kind==='ex'?`<div style="margin:6px 0"><b>${esc(it.n)}</b><div class="muted">${it.sets.map(x=>fmtSet(x,it.type)).join(' · ')}</div></div>`:`<div style="margin:6px 0">🏃 ${esc(it.n)} — ${esc(it.min)} min</div>`).join('')}
    ${st.vol?`<p class="small muted">Volume total : ${Math.round(st.vol).toLocaleString('fr-CA')} lb</p>`:''}
    ${s.notes?`<p class="small" style="white-space:pre-wrap">📝 ${esc(s.notes)}</p>`:''}
    <button class="btn sm" data-a="del-session" data-id="${esc(s.id)}">Supprimer</button></div></details>`});
  return h}

function currentWeight(){const w=S.profile.weighIns||[];if(!w.length)return null;const last=parseYmd(w[w.length-1].d);
  const rec=w.filter(x=>(last-parseYmd(x.d))/864e5<7);return r1(rec.reduce((a,x)=>a+x.lb,0)/rec.length)}
function viewWeight(){
  const p=S.profile,w=p.weighIns||[],cur=currentWeight();const goal=p.startWeight-p.targetWeight;
  const lost=cur!=null?r1(p.startWeight-cur):0;const pct=goal>0?Math.max(0,Math.min(100,Math.round(lost/goal*100))):0;
  const wk=weekNum();const expected=r1(Math.min(goal,goal/12*Math.min(wk,12)));
  let rate='—';if(w.length>=2){const days=(parseYmd(w[w.length-1].d)-parseYmd(w[0].d))/864e5;if(days>=7)rate=r1((w[0].lb-w[w.length-1].lb)/(days/7))+' lb/sem'}
  let h=`<section class="hero"><div class="kicker">Poids</div><h1>${lost>0?'−'+lost:lost} lb sur ${r1(goal)}</h1><div class="sub">${p.startWeight} lb → objectif ${p.targetWeight} lb</div></section>
  <div class="card"><div class="bar"><i style="width:${pct}%"></i></div><div class="small muted">${pct} % de ton objectif · repère semaine ${Math.min(wk,12)} : environ −${expected} lb</div>
  <div class="grid3" style="margin-top:12px"><div class="stat"><b>${cur??'—'}</b><span>Moyenne 7 jours</span></div><div class="stat"><b>${rate}</b><span>Rythme (visé ~1,7)</span></div><div class="stat"><b>${cur!=null?r1(cur-p.targetWeight):r1(goal)}</b><span>lb restantes</span></div></div></div>
  <div class="card"><h2>Ajouter une pesée</h2><p class="small muted">Pèse-toi 3–4 matins par semaine, à jeun. On compare les moyennes, pas les jours.</p>
  <div class="grid2"><div><label class="lbl">Date</label><input type="date" id="wd" value="${ymd(new Date())}"></div><div><label class="lbl">Poids (lb)</label><input type="number" inputmode="decimal" step="0.1" id="wl" placeholder="${cur??p.startWeight}"></div></div>
  <button class="btn pri block" style="margin-top:10px" data-a="add-weigh">Enregistrer</button></div>
  <div class="card"><h2>Courbe</h2>${chart(w.map(x=>({x:parseYmd(x.d).getTime(),y:x.lb})),{target:p.targetWeight})}</div>`;
  if(w.length){const byWk={};w.forEach(x=>{const k=ymd(mondayOf(parseYmd(x.d)));(byWk[k]=byWk[k]||[]).push(x.lb)});
    const keys=Object.keys(byWk).sort().reverse().slice(0,8);
    h+=`<div class="card"><h2>Moyennes hebdo</h2><table><tr><th>Semaine du</th><th class="r">Moyenne</th><th class="r">Pesées</th></tr>${keys.map((k,i)=>{const a=byWk[k],avg=r1(a.reduce((s,v)=>s+v,0)/a.length);
      const prev=keys[i+1]?r1(byWk[keys[i+1]].reduce((s,v)=>s+v,0)/byWk[keys[i+1]].length):null;const d=prev!=null?r1(avg-prev):null;
      return`<tr><td>${fmtShort(k)}</td><td class="r"><b>${avg}</b>${d!=null?` <span class="small" style="color:${d<=0?'var(--ok)':'var(--warn)'}">${d>0?'+':''}${d}</span>`:''}</td><td class="r muted">${a.length}</td></tr>`}).join('')}</table></div>
    <div class="card"><h2>Pesées</h2><table>${[...w].reverse().slice(0,30).map(x=>`<tr><td>${fmtDate(x.d)}</td><td class="r"><b>${x.lb}</b> lb</td><td class="r"><button class="btn sm ghost" data-a="del-weigh" data-d="${x.d}">✕</button></td></tr>`).join('')}</table></div>`}
  return h}

function viewPlan(){
  const p=S.profile,wk=weekNum(),pi=phaseIdx(wk),prog=PROGRAMS[p.program];
  let h=`<section class="hero"><div class="kicker">Programme</div><h1>Perdre 20 lb en 12 semaines</h1><div class="sub">5 jours/semaine · 45–60 min · repos samedi et dimanche</div></section>
  <div class="card"><h2>Programme actif</h2><div class="seg">${Object.entries(PROGRAMS).map(([k,v])=>`<button class="${p.program===k?'on':''}" data-a="prog" data-k="${k}">${v.name}</button>`).join('')}</div>
  <p class="small muted" style="margin-top:8px">${p.program==='machines'?'Machines guidées uniquement : apprends les mouvements et bâtis ta force. Tu peux rester ici 4 à 6 semaines (ou plus) avant de passer au programme complet.':'Poids libres + machines. Si tu débutes, fais seulement 2 séries par exercice les 2 premières semaines (bouton « − Série »).'}</p></div>
  <div class="card"><h2>Ta semaine</h2>${DAYS.map(d=>{const t=prog.days[d.k];return`<div class="plan-day"><b>${d.L}</b> — ${esc(t.t)}${t.rest?`<div class="small muted">${esc(t.note)}</div>`:
    `<ul>${(t.ex||[]).map(e=>`<li>${esc(e.n)} — ${e.s} × ${e.r}${e.rMax>e.r?'–'+e.rMax:''}${e.type==='t'?' s':''}</li>`).join('')}${(t.cardio||[]).map(c=>`<li>🏃 ${esc(c.n)} — ${c.min==='P'?PHASES[pi].after:c.min} min</li>`).join('')}</ul>`}</div>`}).join('')}</div>
  <div class="card"><h2>Progression sur 12 semaines</h2><table><tr><th>Sem.</th><th>Cardio après muscu</th><th>Vendredi</th><th class="r">Pas/jour</th></tr>
  ${PHASES.map((ph,i)=>`<tr style="${i===pi?'color:var(--acc);font-weight:700':''}"><td>${ph.wk}</td><td>${ph.after} min</td><td>${ph.fri}</td><td class="r">${ph.steps}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Règles de progression</h2><ul style="padding-left:18px;margin:0;font-size:14px;color:#c9d0dc">
  <li>5 minutes d'échauffement avant chaque séance.</li><li>60 à 120 s de repos entre les séries (le chrono part tout seul quand tu coches une série).</li>
  <li>Choisis une charge qui te laisse environ 2 reps « en réserve ».</li><li>Quand tu fais toutes tes reps facilement avec une bonne technique, monte d'un palier à la séance suivante — l'app te l'indique avec « ↑ Monte la charge ».</li>
  <li>Si tu dois te balancer ou perdre le contrôle, baisse la charge.</li></ul></div>
  <div class="card"><h2>Alimentation</h2><ul style="padding-left:18px;margin:0;font-size:14px;color:#c9d0dc">
  <li>Protéines : 1,6 à 2 g par kg de poids corporel par jour (≈ ${Math.round(p.startWeight/2.2046*1.6)}–${Math.round(p.startWeight/2.2046*2)} g pour toi).</li>
  <li>Déficit de départ : 500 à 750 calories/jour, à ajuster selon tes résultats.</li><li>Eau : 2 à 3 L par jour. Sommeil : 7 à 9 h.</li>
  <li>Si ton énergie ou ta force s'effondre, ralentis — ne coupe pas les calories drastiquement.</li></ul></div>
  <div class="card"><h2>Réglages</h2>
  <div class="grid2"><div class="field"><label class="lbl">Poids de départ (lb)</label><input type="number" inputmode="decimal" step="0.1" data-s="startWeight" value="${p.startWeight}"></div>
  <div class="field"><label class="lbl">Poids cible (lb)</label><input type="number" inputmode="decimal" step="0.1" data-s="targetWeight" value="${p.targetWeight}"></div></div>
  <div class="field"><label class="lbl">Début du programme (semaine 1)</label><input type="date" data-s="startDate" value="${p.startDate}"></div>
  <h3 style="margin:14px 0 6px">Sauvegarde</h3><p class="small muted">Tes données sont gardées seulement sur ce téléphone. Exporte une sauvegarde de temps en temps (dans Fichiers, iCloud ou par courriel) pour ne rien perdre.</p>
  <div class="row-actions" style="flex-wrap:wrap"><button class="btn sm pri" data-a="export">⬆️ Exporter</button><button class="btn sm" data-a="import">⬇️ Importer</button><button class="btn sm" data-a="copy">📋 Copier</button></div>
  <input type="file" id="impf" accept=".json,application/json" hidden><div id="exp"></div>${S.lastBackup?`<p class="small muted">Dernière sauvegarde : ${fmtDate(S.lastBackup)}</p>`:''}</div>
  <p class="store-note">💾 Données sauvegardées sur ce téléphone · fonctionne hors ligne</p>`;
  return h}

function render(){
  const v={today:viewToday,history:viewHistory,weight:viewWeight,plan:viewPlan}[S.tab]();
  $('#view').innerHTML=v;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab))}

/* ---------- actions ---------- */
function armed(b,label){if(b.dataset.armed)return true;b.dataset.armed='1';const old=b.textContent;b.textContent=label;b.classList.add('danger');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=old;b.classList.remove('danger')}},3000);return false}
async function finish(btn){
  const w=working();const items=[];
  w.items.forEach(it=>{if(it.kind==='ex'){const sets=it.sets.filter(s=>s.done).map(s=>({lb:it.type==='w'?num(s.lb):null,reps:num(s.reps)}));if(sets.length)items.push({kind:'ex',n:it.n,type:it.type,planned:it.sets.length,sets})}
    else if(it.done)items.push({kind:'cardio',n:it.n,min:num(it.min)||0})});
  if(!items.length){toast('Coche au moins une série ou un cardio avant de terminer',true);return}
  btn.disabled=true;
  const s={id:'s'+Date.now(),date:w.date,dayKey:w.dayKey,program:w.program,title:w.title,week:w.week,items,notes:w.notes||'',finishedAt:Date.now()};
  try{await Store.addSession(s);S.sessions.unshift(s);S.draft=null;S.preview=null;clearTimeout(draftT);Store.delDoc('draft').catch(()=>{});stopTimer();
    toast('Séance enregistrée 🔥');S.tab='history';render();scrollTo(0,0)}catch(e){btn.disabled=false;saveErr(e)}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||/INPUT|TEXTAREA|SELECT/.test(b.tagName))return;
  const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,w=working();
  switch(a){
    case'tab':S.tab=b.dataset.t;S.pendingDay=null;render();scrollTo(0,0);break;
    case'day':{const k=b.dataset.k;if(S.draft&&S.draft.dayKey!==k){S.pendingDay=k}else if(!S.draft){S.viewDay=k;S.preview=null}render();break}
    case'day-cancel':S.pendingDay=null;render();break;
    case'day-discard':S.viewDay=S.pendingDay;S.pendingDay=null;S.draft=null;S.preview=null;clearTimeout(draftT);Store.delDoc('draft').catch(saveErr);render();break;
    case'discard':if(!armed(b,'Confirmer l\'abandon ?'))return;S.draft=null;S.preview=null;clearTimeout(draftT);Store.delDoc('draft').catch(saveErr);stopTimer();render();break;
    case'done':{const it=w.items[i],s=it.sets[j];s.done=!s.done;
      if(s.done&&(s.reps===''||s.reps==null)){s.reps=it.rMax;const inp=document.querySelector(`input[data-a="reps"][data-i="${i}"][data-j="${j}"]`);if(inp)inp.value=it.rMax}
      const row=document.getElementById(`set-${i}-${j}`);row.classList.toggle('done',s.done);b.textContent=s.done?'✓':'';
      if(s.done)startTimer(it.type==='w'?90:60);touch();break}
    case'addset':{const it=w.items[i],l=it.sets[it.sets.length-1];it.sets.push({lb:l?l.lb:'',reps:'',done:false});touch();render();break}
    case'rmset':{w.items[i].sets.pop();touch();render();break}
    case'cdone':{const it=w.items[i];it.done=!it.done;document.getElementById('c-'+i).classList.toggle('done',it.done);b.textContent=it.done?'✓':'';touch();break}
    case'finish':finish(b);break;
    case'timer-start':startTimer(+b.dataset.s);break;
    case'timer-add':T.end=Math.max(T.end,Date.now())+15000;$('#timer').classList.remove('fin');clearInterval(T.h);T.h=setInterval(tick,250);tick();break;
    case'timer-stop':stopTimer();break;
    case'del-session':{if(!armed(b,'Confirmer la suppression'))return;const id=b.dataset.id;
      Store.delSession(id).then(()=>{S.sessions=S.sessions.filter(s=>s.id!==id);render();toast('Séance supprimée')}).catch(saveErr);break}
    case'add-weigh':{const d=$('#wd').value,lb=num($('#wl').value);if(!d||lb==null||lb<50||lb>600){toast('Entre un poids valide',true);return}
      const arr=(S.profile.weighIns||[]).filter(x=>x.d!==d);arr.push({d,lb:r1(lb)});arr.sort((a,b)=>a.d<b.d?-1:1);S.profile.weighIns=arr;
      saveProfile().then(()=>toast('Pesée enregistrée'));render();break}
    case'del-weigh':S.profile.weighIns=S.profile.weighIns.filter(x=>x.d!==b.dataset.d);saveProfile();render();break;
    case'prog':if(S.profile.program!==b.dataset.k){S.profile.program=b.dataset.k;S.preview=null;saveProfile();render();toast('Programme : '+PROGRAMS[b.dataset.k].name)}break;
    case'export':{const txt=backupTxt(),name='mon-gym-'+ymd(new Date())+'.json';
      const done=()=>{S.lastBackup=ymd(new Date());Store.ls('lastBackup',S.lastBackup);toast('Sauvegarde exportée')};
      try{const f=new File([txt],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(done,()=>{});break}}catch(err){}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done();break}
    case'copy':{const txt=backupTxt();const show=()=>{$('#exp').innerHTML='<textarea style="margin-top:8px;font-size:12px" readonly></textarea>';$('#exp textarea').value=txt;$('#exp textarea').select()};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Sauvegarde copiée'),show)}catch(err){show()}break}
    case'import':$('#impf').click();break;
    case'import-ok':{if(!armed(b,'Sûr ? Ça remplace tout'))return;const d=S.pendingImport;S.pendingImport=null;
      S.profile={...defaultProfile(),...d.profile};S.sessions=d.sessions.sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0));
      Store.ls('profile',S.profile);Store.ls('sessions',S.sessions);S.draft=null;S.preview=null;Store.ls('draft',null);render();toast('Sauvegarde importée ✅');break}
  }});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;if(!a)return;const w=working();if(!w)return;const i=+t.dataset.i,j=+t.dataset.j;
  if(a==='lb')w.items[i].sets[j].lb=t.value;else if(a==='reps')w.items[i].sets[j].reps=t.value;else if(a==='min')w.items[i].min=t.value;else if(a==='notes')w.notes=t.value;else return;touch()});
function backupTxt(){return JSON.stringify({app:'mon-gym',version:1,exportedAt:new Date().toISOString(),profile:S.profile,sessions:S.sessions},null,1)}
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='impf'){const f=t.files[0];t.value='';if(!f)return;f.text().then(txt=>{const d=JSON.parse(txt);
    if(!d||!d.profile||!Array.isArray(d.sessions))throw 0;S.pendingImport=d;
    $('#exp').innerHTML=`<div class="banner" style="margin-top:10px">Fichier lu : ${d.sessions.length} séances, ${(d.profile.weighIns||[]).length} pesées. Remplacer les données actuelles ?<div class="row-actions"><button class="btn sm danger" data-a="import-ok">Remplacer</button></div></div>`})
    .catch(()=>toast('Fichier de sauvegarde invalide',true));return}
  if(t.dataset.a==='histex'){S.histEx=t.value;render();return}
  const k=t.dataset.s;if(!k)return;
  if(k==='startDate'){if(!t.value)return;S.profile.startDate=t.value}else{const v=num(t.value);if(v==null||v<50||v>600){toast('Valeur invalide',true);return}S.profile[k]=r1(v)}
  S.preview=null;saveProfile().then(()=>toast('Réglage enregistré'))});

/* ---------- boot ---------- */
(async function boot(){
  const slow=setTimeout(()=>{const s=$('#slow');if(s)s.hidden=false},10000);
  await Store.init();
  try{
    const [prof,draft,sess]=await Promise.all([Store.getDoc('profile'),Store.getDoc('draft'),Store.listSessions()]);
    S.sessions=(sess||[]).sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0));
    if(prof)S.profile={...defaultProfile(),...prof};else{S.profile=defaultProfile();saveProfile()}
    if(draft&&draft.items){if(draft.date===ymd(new Date()))S.draft=draft;else Store.delDoc('draft').catch(()=>{})}
  }catch(e){console.error(e);S.profile=S.profile||defaultProfile();toast('Impossible de charger tes données pour le moment',true)}
  S.lastBackup=Store.ls('lastBackup');
  clearTimeout(slow);render();
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
